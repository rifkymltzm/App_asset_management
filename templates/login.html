{% extends 'base.html' %}

{% block title %}Masuk ke Akun - Asset Management{% endblock %}

{% block content %}
<div class="flex min-h-[70vh] flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-6 text-center text-3xl font-extrabold tracking-tight text-white">
            Masuk ke Akun Anda
        </h2>
        <p class="mt-2 text-center text-sm text-slate-400">
            Atau
            <a href="{% url 'signup' %}" class="font-medium text-indigo-400 hover:text-indigo-300 transition duration-150">
                daftar akun baru secara gratis
            </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="glass-panel py-8 px-4 shadow-2xl rounded-2xl sm:px-10">
            <form class="space-y-6" method="POST">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300">
                        Username
                    </label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required
                            class="block w-full rounded-xl bg-slate-900/60 border border-slate-800 px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-150">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300">
                        Password
                    </label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required
                            class="block w-full rounded-xl bg-slate-900/60 border border-slate-800 px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-150">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="flex w-full justify-center rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900 transition duration-150">
                        Masuk Sekarang
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
