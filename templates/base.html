<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Asset Management{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0b111e;
        color: #f3f4f6;
      }
      .glass-panel {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.4);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .text-gradient {
        background: linear-gradient(to right, #6366f1, #a855f7, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body
    class="min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white"
  >
    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
      {% if messages %}
      <div class="mb-6 space-y-2">
        {% for message in messages %}
        <div
          class="p-4 rounded-xl text-sm border {% if message.tags == 'success' %}bg-emerald-500/10 border-emerald-500/20 text-emerald-400{% elif message.tags == 'error' %}bg-rose-500/10 border-rose-500/20 text-rose-400{% else %}bg-blue-500/10 border-blue-500/20 text-blue-400{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %} {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer
      class="border-t border-slate-900 py-6 text-center text-sm text-slate-500 bg-slate-950/40"
    >
      <p>
        &copy; 2026 Asset Management App. Dirancang Secara Efisien &
        Profesional.
      </p>
    </footer>

    {% block extra_js %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  </body>
</html>
