{% extends 'base.html' %}

{% block title %}Hapus Aset - Asset Management{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="glass-panel p-8 rounded-2xl shadow-2xl border border-rose-500/10">
        <h2 class="text-xl font-bold tracking-tight text-white mb-4 flex items-center">
            <svg class="h-6 w-6 text-rose-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            Hapus Aset?
        </h2>
        <p class="text-slate-400 mb-6 text-sm">
            Apakah Anda yakin ingin menghapus <strong class="text-white">{{ asset.instrument.ticker_symbol }}</strong> dari portofolio Anda? Tindakan ini tidak dapat dibatalkan.
        </p>
        <form method="POST" class="flex justify-end space-x-3">
            {% csrf_token %}
            <a href="{% url 'dashboard' %}" class="rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-300 transition duration-150">
                Batal
            </a>
            <button type="submit" class="rounded-xl bg-rose-600 hover:bg-rose-500 px-4 py-2.5 text-sm font-bold text-white shadow-lg shadow-rose-600/30 transition duration-150">
                Hapus Permanen
            </button>
        </form>
    </div>
</div>
{% endblock %}
